spring.application.name=avistamientos-api
server.port=8080

# Base de datos H2 guardada en el archivo ./data/avistamientos.mv.db
# (los datos se conservan aunque se reinicie la API)
spring.datasource.url=jdbc:h2:file:./data/avistamientos
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea o actualiza la tabla automáticamente según la clase Avistamiento
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 para ver la tabla: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/avistamientos, usuario: sa, sin contraseña)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON con sangría para que sea fácil de leer en curl
spring.jackson.serialization.indent-output=true

# Cargar avistamientos de ejemplo si la base está vacía
app.datos-ejemplo=true
